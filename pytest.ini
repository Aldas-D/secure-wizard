[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    unit: unit tests (be DB)
    integration: integracijos testai (su DB)
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
