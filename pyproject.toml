[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # bandit security
]
ignore = ["S101", "S104", "S105"]  # assert OK testuose, 0.0.0.0 OK Docker

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
