user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # PRIVATUMAS: žetonų kelias paslepiamas access log'e.
    # Pvz. /quiz/abc-token/result → /quiz/[REDACTED]/result.
    # Tai svarbu, nes raw token suteikia prieigą prie sesijos rezultato.
    map $request_uri $loggable_uri {
        default                                $request_uri;
        ~^(?<prefix>/quiz/)[^/]+(?<suffix>/.*)$  $prefix[REDACTED]$suffix;
        ~^(?<prefix2>/api/v1/sessions/)[^/]+(?<suffix2>.*)$ $prefix2[REDACTED]$suffix2;
    }

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $loggable_uri $server_protocol" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    server_tokens off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Timeouts: apsauga nuo slowloris-tipo atakų
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;

    # Body size — atitinka MAX_CONTENT_LENGTH Flask config'e
    client_max_body_size 1M;
    client_body_buffer_size 128k;
    large_client_header_buffers 4 8k;

    # Gzip kompresija
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/json application/javascript;

    # Rate limiting zonos
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=connlimit:10m;

    upstream flask_app {
        server web:8000;
        keepalive 32;
    }

    # Default server — atmeta visus request'us su nežinomu Host header.
    # Apsauga nuo host header injection / cache poisoning.
    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        return 444;  # nginx-specific: nutraukia connection be response
    }

    # HTTP → HTTPS redirect
    server {
        listen 80;
        # SVARBU: nustatykite tikrą domain'ą prieš deploy
        server_name secure-wizard.example.lt www.secure-wizard.example.lt;
        return 301 https://$host$request_uri;
    }

    # HTTPS
    server {
        listen 443 ssl http2;
        server_name secure-wizard.example.lt www.secure-wizard.example.lt;

        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # Mozilla "intermediate" config (stabilus, plačiai palaikomas, modernus).
        # Naujausią generuokite: https://ssl-config.mozilla.org/
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;  # moderniose šifrų sąrašuose tai yra rekomenduojama
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;

        # Security headers
        # HSTS — TIK po to, kai esate tikras, kad sertifikatai veikia.
        # `preload` reikalauja submission į https://hstspreload.org/.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;

        # Connection limit per IP
        limit_conn connlimit 20;

        # Statiniai failai — Nginx serveruoja tiesiogiai
        location /static/ {
            alias /app/static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
            # Saugumas: neleisti .py, .env ir kitų jautrių failų per /static/
            location ~ \.(py|env|db|sqlite|log|conf|yml|yaml|toml)$ {
                deny all;
                return 404;
            }
        }

        # API endpointai — griežtesnis rate limit
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://flask_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Visi kiti endpointai
        location / {
            limit_req zone=general burst=50 nodelay;
            proxy_pass http://flask_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check — be rate limit, be access log
        location = /healthz {
            proxy_pass http://flask_app;
            access_log off;
        }

        # Blokuojam jautrius kelius
        location ~ /\.(?!well-known) {
            deny all;
            return 404;
        }
    }
}
